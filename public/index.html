<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root {
    --bg: #e4e8e2;
    --panel: #f6f7f3;
    --ink: #1f2430;
    --muted: #697180;
    --line: #d0d6cd;
    --chip: #e9ece6;
    --ok: #2f9a5a;
    --warn: #c98a12;
    --alert: #d4433b;
    --pixel: "Galmuri11", "Galmuri9", "Malgun Gothic", monospace;
    --body: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191c21;
      --panel: #21252c;
      --ink: #e6e9ee;
      --muted: #9aa2ae;
      --line: #323843;
      --chip: #2b3039;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--body);
  }

  header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 2px solid var(--line);
  }
  h1 { margin: 0; font: 20px/1 var(--pixel); letter-spacing: .02em; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .stat {
    font: 12px/1 var(--pixel); padding: 7px 10px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 4px;
  }
  .stat b { font-weight: normal; font-size: 14px; margin-left: 4px; }
  .stat.alert { border-color: var(--alert); color: var(--alert); }
  .conn { display: inline-flex; align-items: center; gap: 6px; font: 12px/1 var(--pixel); color: var(--muted); }
  .conn::before { content: ""; width: 8px; height: 8px; background: var(--alert); }
  .conn.on::before { background: var(--ok); }

  .office-view { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }

  .office { position: relative; overflow: auto; padding: 20px; }
  canvas {
    display: block; image-rendering: pixelated;
    border: 3px solid #3a3346; border-radius: 2px;
    box-shadow: 6px 6px 0 rgba(30, 25, 40, .18);
  }
  .empty {
    position: absolute; inset: 20px auto auto 20px; display: none;
    pointer-events: none; place-content: center; text-align: center;
  }
  .empty.show { display: grid; }
  .empty p {
    margin: 0; padding: 14px 18px; background: rgba(31, 36, 48, .86); color: #fff;
    font: 13px/1.7 var(--pixel); border-radius: 4px;
  }
  .empty code { background: rgba(255,255,255,.16); padding: 1px 6px; border-radius: 3px; font-family: var(--pixel); }

  .tip {
    position: absolute; z-index: 5; display: none; max-width: 260px; pointer-events: none;
    padding: 10px 12px; background: var(--panel); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,.18);
  }
  .tip strong { font: 13px/1.3 var(--pixel); display: block; margin-bottom: 4px; }
  .tip span { display: block; color: var(--muted); font-size: 12px; }

  aside {
    min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border-left: 2px solid var(--line);
  }
  aside section { min-height: 0; overflow: auto; padding: 16px 18px; }
  #roster { flex: 1 1 58%; }
  #logbox { flex: 1 1 42%; border-top: 2px solid var(--line); }
  h2 { margin: 0 0 10px; font: 14px/1 var(--pixel); }

  #usage { flex: none; border-bottom: 2px solid var(--line); }
  .limit { margin-bottom: 12px; }
  .limit-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .limit-head b { margin-left: auto; font: 15px/1 var(--pixel); }
  .bar { height: 10px; margin: 6px 0 4px; background: var(--chip); border: 2px solid var(--line); }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .bar i.warn { background: var(--warn); }
  .bar i.alert { background: var(--alert); }
  .limit small, .usage-hint, .tok-today small { color: var(--muted); font-size: 12px; }
  .usage-hint { margin: 0 0 12px; }
  .tok-today { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; padding: 10px 0; border-top: 1px dashed var(--line); }
  .tok-today b { font: 18px/1 var(--pixel); }
  .tok-today small { grid-column: 1 / -1; }
  .sess-row { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 12px; }
  .sess-row .name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .sess-row .tok { font: 12px/1.4 var(--pixel); text-align: right; }
  .sess-row .sub { grid-column: 1 / -1; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ctx { display: inline-flex; align-items: center; gap: 5px; }
  .ctx .bar { width: 64px; height: 8px; margin: 0; border-width: 1px; }

  .card {
    position: absolute; z-index: 8; width: 300px; max-width: calc(100% - 24px);
    padding: 14px 16px; background: var(--panel); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 6px; box-shadow: 6px 6px 0 rgba(0,0,0,.18);
  }
  .card[hidden] { display: none; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-head b { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .card-head small { display: block; color: var(--muted); font-size: 12px; }
  .card-head .chip { margin-left: auto; }
  .avatar.sm { width: 30px; height: 30px; font-size: 13px; }
  .card-x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
  .card-x:hover { color: var(--ink); }
  .card-sec { padding: 8px 0; border-top: 1px dashed var(--line); }
  .card-sec .lbl { display: flex; justify-content: space-between; font: 11px/1.4 var(--pixel); color: var(--muted); margin-bottom: 3px; }
  .card-sec p { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
  .card-sec p small { color: var(--muted); font-size: 11px; margin-left: 4px; white-space: nowrap; }
  .card-sec .quote { font-style: italic; }
  .recent { list-style: none; margin: 0; padding: 0; max-height: 150px; overflow: auto; }
  .recent li { display: flex; gap: 8px; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .recent li span { overflow-wrap: anywhere; }
  .recent time { color: var(--muted); font: 11px/1.5 var(--pixel); white-space: nowrap; }
  .card-report {
    width: 100%; margin-top: 8px; padding: 8px 10px; text-align: left; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--ink); background: var(--chip); border: 2px solid var(--line); border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-report:hover { border-color: var(--ink); }
  .person .what.task { color: var(--ink); }

  .dept { margin-bottom: 14px; }
  .dept-head { display: flex; align-items: center; gap: 8px; font: 13px/1 var(--pixel); margin-bottom: 6px; }
  .swatch { width: 10px; height: 10px; flex: none; }
  .dept-head small { color: var(--muted); font: inherit; margin-left: auto; }
  .person { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0 6px 18px; border-top: 1px dashed var(--line); }
  .person .who { font-weight: 600; overflow-wrap: anywhere; }
  .person .what { grid-column: 1 / -1; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .vacant { padding-left: 18px; color: var(--muted); font-size: 12px; }
  .chip { font: 11px/1 var(--pixel); padding: 4px 6px; background: var(--chip); border-radius: 3px; align-self: start; white-space: nowrap; }
  .chip.working { color: var(--ok); }
  .chip.waiting { color: var(--muted); }
  .chip.alert { background: var(--alert); color: #fff; }
  .chip.done { color: var(--warn); }

  ol.log { list-style: none; margin: 0; padding: 0; }
  ol.log li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 12px; }
  ol.log time { color: var(--muted); font: 11px/1.6 var(--pixel); }
  ol.log b { font-weight: 600; }


  nav { display: flex; gap: 4px; }
  nav a {
    position: relative; font: 13px/1 var(--pixel); color: var(--muted); text-decoration: none;
    padding: 8px 12px; border: 2px solid transparent; border-radius: 4px;
  }
  nav a:hover { color: var(--ink); }
  nav a[aria-current="page"] { color: var(--ink); background: var(--panel); border-color: var(--line); }
  nav a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #4a86d9; outline-offset: 2px; }
  .badge {
    display: inline-block; min-width: 18px; margin-left: 4px; padding: 3px 5px;
    background: var(--alert); color: #fff; font: 11px/1 var(--pixel); text-align: center; border-radius: 3px;
  }
  .badge[hidden] { display: none; }

  .inbox { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); }
  .inbox[hidden], main[hidden] { display: none; }
  .mail-list { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-right: 2px solid var(--line); }
  .mail-tools { padding: 14px 16px 10px; border-bottom: 2px solid var(--line); display: grid; gap: 10px; }
  .mail-tools input {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 2px solid var(--line); border-radius: 4px;
  }
  .filters { display: flex; gap: 6px; }
  .filters button, .mail-actions button {
    font: 12px/1 var(--pixel); color: var(--ink); cursor: pointer;
    padding: 7px 10px; background: var(--chip); border: 2px solid var(--line); border-radius: 4px;
  }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .mail-actions button.danger:hover { border-color: var(--alert); color: var(--alert); }
  #mail-items { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  .mail-item {
    display: grid; gap: 3px; width: 100%; text-align: left; cursor: pointer;
    padding: 12px 16px 12px 22px; background: none; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; position: relative;
  }
  .mail-item:hover { background: var(--chip); }
  .mail-item.active { background: var(--chip); box-shadow: inset 4px 0 0 var(--ink); }
  .mail-item.unread::before { content: ""; position: absolute; left: 8px; top: 19px; width: 6px; height: 6px; background: #4a86d9; }
  .mi-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .mi-top b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-item.unread .mi-top b, .mail-item.unread .mi-subject { font-weight: 700; }
  .mi-dept { font-size: 11px; white-space: nowrap; }
  .mi-top time { margin-left: auto; color: var(--muted); font: 11px/1 var(--pixel); white-space: nowrap; }
  .mi-subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi-preview { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mail-none { padding: 24px 16px; color: var(--muted); }

  .mail-read { min-height: 0; overflow: auto; padding: 28px 36px 48px; }
  .mail-empty { height: 100%; display: grid; place-content: center; color: var(--muted); font: 13px/1.8 var(--pixel); text-align: center; }
  .mail-subject { margin: 0 0 16px; font-size: 22px; line-height: 1.35; font-weight: 700; max-width: 760px; }
  .mail-meta { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 2px solid var(--line); max-width: 760px; flex-wrap: wrap; }
  .avatar { width: 40px; height: 40px; flex: none; display: grid; place-content: center; color: #fff; font: 16px/1 var(--pixel); border-radius: 4px; }
  .mail-meta .who b { font-weight: 700; }
  .mail-meta .who small { display: block; color: var(--muted); font-size: 12px; }
  .mail-actions { margin-left: auto; display: flex; gap: 6px; }

  .md { max-width: 760px; padding-top: 8px; line-height: 1.75; overflow-wrap: anywhere; }
  .md h3, .md h4, .md h5 { margin: 1.4em 0 .5em; line-height: 1.4; }
  .md h3 { font-size: 17px; } .md h4 { font-size: 15px; } .md h5 { font-size: 14px; }
  .md p { margin: .7em 0; }
  .md ul, .md ol { padding-left: 1.4em; margin: .6em 0; }
  .md li { margin: .25em 0; }
  .md code { font-family: Consolas, "D2Coding", monospace; font-size: .92em; background: var(--chip); padding: 1px 5px; border-radius: 3px; }
  .md pre { background: var(--chip); padding: 12px 14px; border-radius: 4px; overflow: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: .8em 0; padding: 4px 14px; border-left: 4px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 2px dashed var(--line); margin: 1.4em 0; }
  .md .tbl { overflow-x: auto; margin: .8em 0; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--chip); }
  .md .omitted {
    margin: .7em 0; padding: 8px 12px; font: 12px/1.4 var(--pixel); color: var(--muted);
    border: 2px dashed var(--line); border-radius: 4px; background: repeating-linear-gradient(-45deg, transparent 0 6px, var(--chip) 6px 12px);
  }

  .attach { max-width: 760px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 0; border-bottom: 2px solid var(--line); }
  .attach > span { font: 12px/1 var(--pixel); color: var(--muted); margin-right: 4px; }
  .file {
    display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%;
    padding: 7px 10px; font: inherit; font-size: 13px; color: var(--ink); text-decoration: none; cursor: pointer;
    background: var(--chip); border: 2px solid var(--line); border-radius: 4px;
  }
  .file:hover { border-color: var(--ink); }
  .file b { font-weight: 600; overflow-wrap: anywhere; }
  .file small { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .file.missing { opacity: .55; text-decoration: line-through; cursor: not-allowed; }
  .md a { color: #3f7fd6; }
  .md a.file-link::before { content: "📎 "; }
  .mi-clip { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    padding: 10px 14px; background: var(--ink); color: var(--panel); border-radius: 4px; font-size: 13px;
  }

  @media (max-width: 900px) {
    .inbox { grid-template-columns: 1fr; grid-template-rows: 45vh auto; }
    .mail-list { border-right: 0; border-bottom: 2px solid var(--line); }
    .mail-read { padding: 20px; }
  }

  @media (max-width: 900px) {
    .office-view { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    aside { border-left: 0; border-top: 2px solid var(--line); }
    aside section { max-height: 50vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Agent Office</h1>
  <nav aria-label="화면 전환">
    <a href="#office" id="tab-office">사무실</a>
    <a href="#inbox" id="tab-inbox">보고서함<span class="badge" id="badge" hidden>0</span></a>
  </nav>
  <span class="conn" id="conn">연결 중</span>
  <div class="stats">
    <span class="stat" id="s-limit-box" hidden>5시간<b id="s-limit">0%</b></span>
    <span class="stat">오늘 토큰<b id="s-tokens">0</b></span>
    <span class="stat">세션<b id="s-sessions">0</b></span>
    <span class="stat">근무 중<b id="s-working">0</b></span>
    <span class="stat" id="s-alert-box">결재 대기<b id="s-alert">0</b></span>
  </div>
</header>

<main class="office-view" id="view-office">
  <div class="office" id="office">
    <canvas id="canvas" role="img" aria-label="에이전트 사무실. 부서별 현황은 오른쪽 목록에서 볼 수 있습니다."></canvas>
    <div class="empty" id="empty">
      <p>아직 출근한 직원이 없습니다.<br>Claude Code에 일을 시키면 팀장이 출근해요.<br>미리 보려면 <code>npm run simulate</code></p>
    </div>
    <div class="tip" id="tip"></div>
    <div class="card" id="card" role="dialog" aria-label="업무 카드" hidden></div>
  </div>
  <aside>
    <section id="usage" aria-label="사용량"><h2>사용량</h2><div id="usage-body"></div></section>
    <section id="roster" aria-label="부서 현황"><h2>부서 현황</h2><div id="roster-body"></div></section>
    <section id="logbox" aria-label="업무 일지"><h2>업무 일지</h2><ol class="log" id="log"></ol></section>
  </aside>
</main>

<main class="inbox" id="view-inbox" hidden>
  <section class="mail-list" aria-label="보고서 목록">
    <div class="mail-tools">
      <input type="search" id="mail-search" placeholder="보낸 사람, 제목, 내용 검색" autocomplete="off">
      <div class="filters" role="group" aria-label="보고서 필터">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="unread" aria-pressed="false">안 읽음</button>
        <button type="button" data-filter="lead" aria-pressed="false">팀장 보고</button>
        <button type="button" data-filter="member" aria-pressed="false">부서 보고</button>
      </div>
    </div>
    <ul id="mail-items"></ul>
  </section>
  <article class="mail-read" id="mail-read" aria-live="polite">
    <div class="mail-empty">보고서를 고르면 여기에 열립니다.<br>서브에이전트가 업무를 마치거나 팀장이 긴 답변을 끝내면 도착해요.</div>
  </article>
</main>

<script>
(() => {
  // ───────── 사무실 치수 (논리 픽셀) ─────────
  const T = 16, ZW = 12, ZH = 8, CH = 3, LOBBY = 2;
  const SPEED = 90; // 걷는 속도 (px/초)
  const TOPPAD = 30; // 맨 윗줄 말풍선이 들어갈 지붕 공간
  const CANVAS_FONT = '"Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  const EMOJI_FONT = '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const officeEl = document.getElementById('office');
  const tipEl = document.getElementById('tip');

  let snap = { config: { leadRoom: '팀장실', defaultDept: 'TF팀', departments: [] }, agents: [], sessions: [], log: [] };
  let layout = null, layoutKey = '';
  const chars = new Map();

  const STATUS = {
    working: '근무 중', idle: '휴식', waiting: '대기', alert: '결재 필요', done: '퇴근',
  };
  const ICON = {
    think: '💭', read: '📖', write: '💻', run: '⚙️', search: '🔍', web: '🌐',
    delegate: '📋', plan: '📝', tool: '🔧',
  };

  // ───────── 색상 유틸 ─────────
  function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) {
    const x = hex(a), y = hex(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  function deptColor(name) {
    const c = snap.config;
    if (name === c.leadRoom) return '#c4573f';
    const d = c.departments.find((d) => d.name === name);
    return (d && /^#[0-9a-f]{6}$/i.test(d.color)) ? d.color : '#8a909a';
  }
  function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

  const SKINS = ['#f3d2b3', '#e8b98f', '#c98d63', '#a8704a', '#f6dcc7'];
  const HAIRS = ['#2b2230', '#5a3a28', '#8b5a2b', '#c9a15a', '#3d3d4a', '#7a2e2e', '#d8d2c8'];
  function lookFor(id) {
    const h = hash(id);
    return {
      seed: h % 1000, skin: SKINS[h % SKINS.length], hair: HAIRS[(h >>> 3) % HAIRS.length],
      style: (h >>> 7) % 4, glasses: (h >>> 11) % 5 === 0, outfit: (h >>> 13) % 3 === 0 ? 'hoodie' : 'badge',
    };
  }

  // ───────── 레이아웃 ─────────
  function zoneNames(cfg) {
    const names = [cfg.leadRoom, ...cfg.departments.map((d) => d.name)];
    if (!names.includes(cfg.defaultDept)) names.push(cfg.defaultDept);
    return names;
  }

  function buildLayout(cfg) {
    const names = zoneNames(cfg);
    const cols = Math.ceil(names.length / 2);
    const W = (LOBBY + cols * ZW) * T, H = (ZH * 2 + CH) * T;
    const corridorY = ZH * T, corridorMid = corridorY + (CH * T) / 2;
    const zones = names.map((name, i) => {
      const top = i < cols, c = top ? i : i - cols;
      const x0 = (LOBBY + c * ZW) * T, y0 = top ? 0 : (ZH + CH) * T;
      const desks = [];
      for (const ry of [3, 5.6]) for (const cx of [2.5, 5.25, 8]) desks.push({ x: Math.round(x0 + cx * T), y: Math.round(y0 + ry * T) });
      return {
        name, top, x0, y0, w: ZW * T, h: ZH * T,
        doorX: Math.round(x0 + 10.5 * T), aisleY: Math.round(y0 + 4.3 * T),
        desks, slots: [], isLead: name === cfg.leadRoom,
      };
    });
    const emptyBottom = names.length % 2 === 1
      ? { x0: (LOBBY + (cols - 1) * ZW) * T, y0: (ZH + CH) * T, w: ZW * T, h: ZH * T } : null;
    return { W, H, corridorY, corridorMid, zones, byName: new Map(zones.map((z) => [z.name, z])), lounge: emptyBottom };
  }

  function zoneOf(ch) { return layout.byName.get(ch.zone); }

  function seatFor(z, k) {
    if (k < z.desks.length) { const d = z.desks[k]; return { x: d.x + 4, y: d.y + 5, desk: d, k }; }
    const j = k - z.desks.length;
    return { x: z.x0 + T + (j % 9) * T, y: z.y0 + 7 * T, desk: null, k };
  }

  function assignSeat(ch) {
    const z = layout.byName.get(ch.data.dept) || layout.byName.get(snap.config.defaultDept);
    let k = z.slots.indexOf(null);
    if (k < 0) { k = z.slots.length; z.slots.push(null); }
    z.slots[k] = ch.id;
    ch.zone = z.name;
    ch.seat = seatFor(z, k);
  }

  function freeSeat(ch) {
    const z = zoneOf(ch);
    if (z) { const k = z.slots.indexOf(ch.id); if (k >= 0) z.slots[k] = null; }
    ch.seat = null;
  }

  const inCorridor = (ch) => ch.y > layout.corridorY - 2 && ch.y < layout.corridorY + CH * T + 2;
  // 책상 뒤로 돌아가서 의자에 앉고, 일어날 때도 책상 뒤로 나와서 걸어 나갑니다
  function exitPath(z, ch, seat = ch.seat) {
    if (!z || inCorridor(ch)) return [];
    const pts = [];
    if (seat && seat.desk && Math.abs(ch.x - seat.x) < 1 && Math.abs(ch.y - seat.y) < 1) {
      const behind = seat.desk.y - 2;
      pts.push([seat.x, behind]);
      if (seat.desk.y < z.aisleY) { const gx = seat.desk.x + 22; pts.push([gx, behind], [gx, z.aisleY]); }
    }
    const lastX = pts.length ? pts[pts.length - 1][0] : ch.x;
    pts.push([lastX, z.aisleY], [z.doorX, z.aisleY], [z.doorX, layout.corridorMid]);
    return pts;
  }
  function enterPath(z, seat) {
    const pts = [[z.doorX, layout.corridorMid], [z.doorX, z.aisleY]];
    if (seat.desk) {
      const behind = seat.desk.y - 2;
      if (seat.desk.y < z.aisleY) { const gx = seat.desk.x + 22; pts.push([gx, z.aisleY], [gx, behind], [seat.x, behind]); }
      else pts.push([seat.x, z.aisleY], [seat.x, behind]);
    } else pts.push([seat.x, z.aisleY]);
    pts.push([seat.x, seat.y]);
    return pts;
  }

  function relayout() {
    layout = buildLayout(snap.config);
    buildBackground();
    for (const ch of [...chars.values()]) {
      if (ch.leaving) { chars.delete(ch.id); continue; }
      assignSeat(ch);
      ch.x = ch.seat.x; ch.y = ch.seat.y; ch.path = []; ch.dir = 'd';
    }
    resize();
  }

  // ───────── 서버 스냅샷 반영 ─────────
  let firstSnapshot = true;
  function applySnapshot(s) {
    snap = s;
    const arriveNow = firstSnapshot; // 페이지를 처음 열었을 때는 이미 출근한 직원을 자리에 바로 앉힘
    firstSnapshot = false;
    const key = JSON.stringify(zoneNames(s.config)) + JSON.stringify(s.config.departments.map((d) => d.color));
    if (key !== layoutKey) { layoutKey = key; relayout(); }

    const ids = new Set(s.agents.map((a) => a.id));
    for (const a of s.agents) {
      let ch = chars.get(a.id);
      if (!ch) {
        ch = { id: a.id, data: a, look: lookFor(a.id), x: 6, y: layout.corridorMid, path: [], dir: 'r', leaving: false };
        chars.set(a.id, ch);
        assignSeat(ch);
        updateSpeech(ch);
        if (arriveNow) { ch.x = ch.seat.x; ch.y = ch.seat.y; ch.dir = 'd'; }
        else ch.path = enterPath(zoneOf(ch), ch.seat);
        continue;
      }
      const prevDept = ch.data.dept;
      ch.data = a;
      updateSpeech(ch);
      if (ch.leaving) {
        ch.leaving = false;
        assignSeat(ch);
        ch.path = [...exitPath(null, ch), ...enterPath(zoneOf(ch), ch.seat)];
      } else if (a.dept !== prevDept) {
        const old = zoneOf(ch), oldSeat = ch.seat;
        freeSeat(ch);
        assignSeat(ch);
        ch.path = [...exitPath(old, ch, oldSeat), ...enterPath(zoneOf(ch), ch.seat)];
      }
    }
    for (const ch of chars.values()) {
      if (!ids.has(ch.id) && !ch.leaving) {
        const z = zoneOf(ch);
        ch.leaving = true;
        ch.path = [...exitPath(z, ch), [6, layout.corridorMid]];
        freeSeat(ch);
      }
    }
    renderPanels();
    onReportsSummary(s.reports);
    renderCard();
  }

  // ───────── 이동 ─────────
  function step(ch, dt) {
    if (!ch.path.length) return;
    const [tx, ty] = ch.path[0];
    const dx = tx - ch.x, dy = ty - ch.y, d = Math.hypot(dx, dy), sp = SPEED * dt;
    if (d <= sp) {
      ch.x = tx; ch.y = ty; ch.path.shift();
      if (!ch.path.length) ch.dir = 'd';
    } else {
      ch.x += (dx / d) * sp; ch.y += (dy / d) * sp;
      ch.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
    }
  }
  const walking = (ch) => ch.path.length > 0;
  const seated = (ch) => !ch.leaving && ch.seat && ch.seat.desk && !walking(ch);

  // ───────── 그래픽: 공통 ─────────
  let g = ctx; // 지금 그리는 대상 (정적 배경을 캐시할 때는 오프스크린 캔버스)
  function rect(c, x, y, w, h) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  const shade = (c, amt) => mix(c, amt > 0 ? '#ffffff' : '#000000', Math.abs(amt));
  function mulberry(a) {
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ───────── 픽셀 스프라이트 ─────────
  // 한 글자 = 한 픽셀. 글자마다 팔레트 색이 들어갑니다 ('.' 은 투명)
  const HEAD = {
    front: ['...OOOOOO...', '..OHHHHHHO..', '.OHHHHHHHHO.', '.OHHHHHHHHO.', '.OHSSSSSSHO.', '.OSSESSESSO.', '.OSSSSSSSSO.', '..OSSmmSSO..', '...OOSSOO...'],
    back:  ['...OOOOOO...', '..OHHHHHHO..', '.OHHHHHHHHO.', '.OHHHHHHHHO.', '.OHHHHHHHHO.', '.OHHhhhhHHO.', '.OhHHHHHHhO.', '..OhhhhhhO..', '...OOSSOO...'],
    side:  ['...OOOOOO...', '..OHHHHHHO..', '.OHHHHHHHHO.', '.OHHHHHHHHO.', '.OSSSSHHHHO.', '.OESSSSHHHO.', '.OSSSSSSHHO.', '..OmSSSSHO..', '...OOSSOO...'],
  };
  const BODY = {
    tie:   ['..OCWWWWCO..', '.OCCCAACCCO.', '.OCCCAACCCO.', '.OcCCAACCcO.', '.OcCCCCCCcO.', '.OSCCCCCCSO.'],
    badge: ['..OCWWWWCO..', '.OCCCCCCCCO.', '.OCCCCCCKCO.', '.OcCCCCCKcO.', '.OcCCCCCCcO.', '.OSCCCCCCSO.'],
    hoodie:['.OcCCCCCCcO.', '.OCCWCCWCCO.', '.OCCWCCWCCO.', '.OcCCCCCCcO.', '.OcCddddCcO.', '.OSCCCCCCSO.'],
    back:  ['..OCCCCCCO..', '.OCCCCCCCCO.', '.OCCCCCCCCO.', '.OcCCCCCCcO.', '.OcCCCCCCcO.', '.OSCCCCCCSO.'],
    side:  ['..OCCWWCCO..', '..OCCCCCCO..', '..OCcCCCCO..', '..OCcCCCCO..', '..OCcCCCCO..', '..OCSCCCCO..'],
  };
  const HIP = '..OPPPPPPO..';
  const LEGS = {
    stand: ['..OPpOOpPO..', '..OPpOOpPO..', '..OBBOOBBO..', '...OO..OO...'],
    walk1: ['..OPpOOpPO..', '..OBBOOpPO..', '...OO.OBBO..', '.......OO...'],
    walk2: ['..OPpOOpPO..', '..OPpOOBBO..', '..OBBO.OO...', '...OO.......'],
  };
  const setAt = (row, i, c) => row.slice(0, i) + c + row.slice(i + 1);

  function headRows(dir, look, blink) {
    let rows = HEAD[dir === 'u' ? 'back' : dir === 'l' || dir === 'r' ? 'side' : 'front'].slice();
    if (look.style === 1 && dir !== 'u') { // 긴 머리
      if (dir === 'd') {
        rows[5] = '.OHSESSESHO.'; rows[6] = '.OHSSSSSSHO.'; rows[7] = '.OHSSmmSSHO.'; rows[8] = '.OHOOSSOOHO.';
      } else { rows[7] = '..OmSSSSHHO.'; rows[8] = '...OOSSHHO..'; }
    }
    if (look.style === 1 && dir === 'u') { rows[7] = '.OhhhhhhhhO.'; rows[8] = '.OhhOSSOhhO.'; }
    if (look.style === 2) { // 풍성한 곱슬머리
      rows[0] = '..OOOOOOOO..'; rows[1] = '.OHHHHHHHHO.'; rows[2] = 'OHHHHHHHHHHO'; rows[3] = 'OHHHHHHHHHHO';
      rows[4] = dir === 'u' ? 'OHHHHHHHHHHO' : dir === 'd' ? 'OHHSSSSSSHHO' : 'OHSSSSHHHHHO';
    }
    if (look.style === 3) rows[1] = '..OhHhHhHO..'; // 짧은 스포츠머리
    if (look.glasses && dir === 'd') rows[5] = '.OSGgGGgGSO.';
    if (blink) rows = rows.map((r) => r.replace(/E/g, 's'));
    return rows;
  }

  function bodyRows(dir, outfit, pose) {
    const rows = BODY[dir === 'u' ? 'back' : dir === 'l' || dir === 'r' ? 'side' : outfit].slice();
    if (dir === 'd' && pose === 'typeA') { rows[4] = setAt(rows[4], 2, 'S'); rows[5] = setAt(setAt(rows[5], 1, '.'), 2, 'O'); }
    if (dir === 'd' && pose === 'typeB') { rows[4] = setAt(rows[4], 9, 'S'); rows[5] = setAt(setAt(rows[5], 10, '.'), 9, 'O'); }
    return rows;
  }

  function paletteFor(ch) {
    const a = ch.look, d = ch.data, lead = d.role === 'lead';
    const shirt = lead ? '#2f3b55' : deptColor(d.dept);
    return {
      key: `${a.skin}${a.hair}${shirt}${lead ? 1 : 0}`,
      O: '#2a2133', E: '#2a2133', G: '#2a2133', g: '#bcd6ea',
      H: a.hair, h: shade(a.hair, -0.28), S: a.skin, s: shade(a.skin, -0.14), m: mix(a.skin, '#7a3b2e', 0.35),
      C: shirt, c: shade(shirt, -0.24), d: shade(shirt, -0.12), W: lead ? '#f2efe9' : shade(shirt, 0.5), A: '#c8453d', K: '#f7f7f2',
      P: lead ? '#262d40' : '#3b4160', p: lead ? '#1b2131' : '#2c3150', B: '#3a2f2a',
    };
  }

  const spriteCache = new Map();
  function spriteFor(ch, dir, pose, legs, blink) {
    const pal = paletteFor(ch);
    const outfit = ch.data.role === 'lead' ? 'tie' : ch.look.outfit;
    const key = `${pal.key}|${dir}|${pose}|${legs}|${blink ? 1 : 0}|${ch.look.style}|${ch.look.glasses ? 1 : 0}|${outfit}`;
    let c = spriteCache.get(key);
    if (c) return c;
    const rows = [...headRows(dir, ch.look, blink), ...bodyRows(dir, outfit, pose), HIP, ...LEGS[legs]];
    c = document.createElement('canvas');
    c.width = 12; c.height = rows.length;
    const sc = c.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const col = pal[row[x]];
        if (!col || row[x] === '.') continue;
        sc.fillStyle = col;
        sc.fillRect(dir === 'r' ? 11 - x : x, y, 1, 1); // 오른쪽을 볼 때는 좌우 반전
      }
    });
    if (spriteCache.size > 600) spriteCache.clear();
    spriteCache.set(key, c);
    return c;
  }

  // ───────── 정적 배경 (한 번 그려서 캐시) ─────────
  let bgCanvas = null;
  function buildBackground() {
    const c = document.createElement('canvas');
    c.width = layout.W; c.height = layout.H + TOPPAD;
    const bctx = c.getContext('2d');
    bctx.translate(0, TOPPAD);
    const prev = g;
    g = bctx;
    try { paintStatic(); } finally { g = prev; }
    bgCanvas = c;
  }

  function paintStatic() {
    const L = layout;
    // 지붕
    rect('#3a3046', 0, -TOPPAD, L.W, TOPPAD);
    rect('#54486a', 0, -TOPPAD, L.W, 2);
    for (let x = 150; x < L.W - 30; x += 58) {
      rect('#2c2438', x, -TOPPAD + 9, 30, 13);
      for (let i = 0; i < 4; i++) rect('#463b5a', x + 2, -TOPPAD + 11 + i * 3, 26, 1);
    }
    rect('#2a2133', 0, -3, L.W, 3);
    rect('#cfc6b6', 0, 0, L.W, L.H);
    // 복도 카펫 타일
    for (let x = 0; x < L.W; x += T) {
      for (let y = L.corridorY; y < L.corridorY + CH * T; y += T) {
        rect(((x + y) / T) % 2 === 0 ? '#d6d0c3' : '#cec7b9', x, y, T, T);
        rect('rgba(0,0,0,0.04)', x, y + T - 1, T, 1);
        rect('rgba(0,0,0,0.04)', x + T - 1, y, 1, T);
      }
    }
    rect('rgba(0,0,0,0.12)', 0, L.corridorY, L.W, 2);
    // 로비 (대리석 바닥)
    const lobby = [[0, 0, LOBBY * T, L.corridorY], [0, L.corridorY + CH * T, LOBBY * T, L.H - L.corridorY - CH * T]];
    for (const [x, y, w, h] of lobby) {
      for (let yy = y; yy < y + h; yy += 8) for (let xx = x; xx < x + w; xx += 8) rect(((xx + yy) / 8) % 2 ? '#c9bfae' : '#d3cab9', xx, yy, 8, 8);
      rect('#2a2133', x + w - 3, y, 3, h);
    }
    drawWaterCooler(15, L.corridorY - 32);
    drawPlant(14, L.H - 8, 0);
    // 출입문
    rect('#2a2133', 0, L.corridorMid - 16, 8, 32);
    rect('#7a5236', 1, L.corridorMid - 15, 6, 30);
    rect('#946747', 1, L.corridorMid - 15, 2, 30);
    rect('#f0c35a', 5, L.corridorMid - 1, 1, 3);
    rect('#8d7d62', 9, L.corridorMid - 10, 7, 20);
    rect('#7d6e55', 10, L.corridorMid - 9, 5, 18);
    for (const z of L.zones) paintZone(z);
    if (L.lounge) paintLounge(L.lounge);
  }

  function paintZone(z) {
    const color = deptColor(z.name);
    const rand = mulberry(hash(z.name));
    const base = mix(color, '#e8dcc5', 0.84);
    // 나무 마루
    rect(base, z.x0, z.y0, z.w, z.h);
    for (let y = z.y0 + 14, row = 0; y < z.y0 + z.h; y += 6, row++) {
      let x = z.x0 - (row % 2) * 14;
      while (x < z.x0 + z.w) {
        const len = 22 + Math.floor(rand() * 22);
        const x1 = Math.max(x, z.x0), x2 = Math.min(x + len, z.x0 + z.w);
        rect(mix(base, rand() < 0.5 ? '#ffffff' : '#000000', rand() * 0.05), x1, y, x2 - x1, 6);
        rect(shade(base, -0.11), x2 - 1, y, 1, 6);
        x += len;
      }
      rect(shade(base, -0.08), z.x0, y + 5, z.w, 1);
    }
    if (z.isLead) paintRug(z.x0 + 14, z.y0 + 28, 138, 76);
    // 벽면
    const wallC = mix(color, '#f6f0e6', 0.7);
    const gapL = z.doorX - 11, gapR = z.doorX + 11;
    const face = (x, w) => {
      rect(wallC, x, z.y0, w, 14);
      rect(shade(wallC, -0.1), x, z.y0 + 9, w, 4);
      rect(shade(wallC, -0.26), x, z.y0 + 13, w, 1);
    };
    if (z.top) face(z.x0, z.w);
    else { face(z.x0, gapL - z.x0); face(gapR, z.x0 + z.w - gapR); rect(shade(base, -0.06), gapL, z.y0, gapR - gapL, 14); }
    rect('rgba(0,0,0,0.09)', z.x0, z.y0 + 14, z.w, 2);
    // 벽 테두리
    const W = '#2a2133';
    rect(W, z.x0, z.y0, 3, z.h);
    rect(W, z.x0 + z.w - 3, z.y0, 3, z.h);
    if (z.top) {
      rect(W, z.x0, z.y0, z.w, 2);
      rect(W, z.x0, z.y0 + z.h - 3, gapL - z.x0, 3);
      rect(W, gapR, z.y0 + z.h - 3, z.x0 + z.w - gapR, 3);
    } else {
      rect(W, z.x0, z.y0, gapL - z.x0, 2);
      rect(W, gapR, z.y0, z.x0 + z.w - gapR, 2);
      rect(W, z.x0, z.y0 + z.h - 3, z.w, 3);
    }
    // 문틀 · 매트
    const fy = z.top ? z.y0 + z.h - 5 : z.y0;
    rect('#6b4f3a', gapL - 2, fy, 3, 5);
    rect('#6b4f3a', gapR - 1, fy, 3, 5);
    rect(shade(color, -0.3), z.doorX - 8, z.top ? z.y0 + z.h - 9 : z.y0 + 16, 16, 4);
    rect(shade(color, -0.15), z.doorX - 7, z.top ? z.y0 + z.h - 8 : z.y0 + 17, 14, 2);
    // 가구
    if (z.isLead) paintWhiteboard(z.x0 + 92, z.y0 + 1);
    paintBookshelf(z.x0 + 146, z.top ? z.y0 + 15 : z.y0 + z.h - 30, rand);
    drawPlant(z.x0 + z.w - 10, z.top ? z.y0 + 40 : z.y0 + z.h - 7, 0);
    drawPlant(z.x0 + 11, z.y0 + z.h - 7, 1);
  }

  function paintRug(x, y, w, h) {
    rect('#7e2f2a', x, y, w, h);
    rect('#a8453a', x + 2, y + 2, w - 4, h - 4);
    rect('#c9a35a', x + 5, y + 5, w - 10, 1); rect('#c9a35a', x + 5, y + h - 6, w - 10, 1);
    rect('#c9a35a', x + 5, y + 5, 1, h - 10); rect('#c9a35a', x + w - 6, y + 5, 1, h - 10);
    for (let i = 0; i < w - 16; i += 8) { rect('#93392f', x + 8 + i, y + 9, 4, 1); rect('#93392f', x + 8 + i, y + h - 10, 4, 1); }
  }

  function paintWhiteboard(x, y) {
    rect('#8d96a0', x, y, 52, 11);
    rect('#fbfbf6', x + 1, y + 1, 50, 8);
    rect('#d4433b', x + 4, y + 3, 14, 1); rect('#4a86d9', x + 4, y + 5, 22, 1); rect('#4fae6a', x + 22, y + 3, 10, 1);
    rect('#f6d65a', x + 38, y + 2, 5, 5); rect('#f59ab5', x + 44, y + 3, 5, 5);
    rect('#6e7781', x + 2, y + 10, 48, 1);
  }

  function paintBookshelf(x, y, rand) {
    rect('#2a2133', x - 1, y - 1, 20, 24);
    rect('#7a5236', x, y, 18, 22);
    rect('#5c3d28', x + 1, y + 1, 16, 20);
    const colors = ['#c8453d', '#4a86d9', '#e3a33b', '#4fae6a', '#9a6fd6', '#f2efe9', '#3a4a63'];
    for (let s = 0; s < 3; s++) {
      const sy = y + 1 + s * 7;
      let bx = x + 2;
      while (bx < x + 16) {
        const bw = 1 + Math.floor(rand() * 2), bh = 4 + Math.floor(rand() * 2);
        rect(colors[Math.floor(rand() * colors.length)], bx, sy + 6 - bh, bw, bh);
        bx += bw + (rand() < 0.2 ? 1 : 0);
      }
      rect('#7a5236', x + 1, sy + 6, 16, 1);
    }
  }

  function drawPlant(x, y, v) {
    rect('rgba(0,0,0,0.15)', x - 5, y + 1, 10, 2);
    rect('#2a2133', x - 4, y - 5, 8, 6);
    rect(v ? '#d9d2c4' : '#b0643a', x - 3, y - 5, 6, 5);
    rect(v ? '#bcb4a5' : '#8e4f2c', x - 3, y - 2, 6, 1);
    if (v) {
      rect('#2f7a3e', x - 4, y - 11, 8, 6); rect('#3f9a50', x - 3, y - 12, 6, 6); rect('#5fbf6a', x - 2, y - 11, 2, 2);
    } else {
      rect('#2f7a3e', x - 1, y - 15, 2, 10);
      rect('#3f9a50', x - 5, y - 12, 4, 3); rect('#3f9a50', x + 1, y - 14, 4, 3); rect('#3f9a50', x - 4, y - 8, 3, 3); rect('#3f9a50', x + 1, y - 9, 4, 3);

  // ───────── 실시간으로 그리는 배경 요소 (창밖 하늘, 시계, 명패) ─────────
  // 주소 끝에 ?hour=22 처럼 붙이면 그 시간대 조명으로 미리 볼 수 있습니다
  const FORCED_HOUR = Number(new URLSearchParams(location.search).get('hour'));
  const hourNow = () => (Number.isFinite(FORCED_HOUR) && new URLSearchParams(location.search).has('hour'))
    ? FORCED_HOUR : new Date().getHours() + new Date().getMinutes() / 60;
  function skyNow() {
    const h = hourNow();
    if (h >= 6 && h < 8) return { top: '#f2c39b', bottom: '#bcd8ee', night: false };
    if (h >= 8 && h < 17) return { top: '#86c3ec', bottom: '#cde8f7', night: false };
    if (h >= 17 && h < 19.5) return { top: '#ec9a6a', bottom: '#f6d29a', night: false };
    return { top: '#1d2748', bottom: '#33437a', night: true };
  }
  function ambientNow() {
    const h = hourNow();
    if (h >= 19.5 || h < 6) return { color: '#10163a', alpha: 0.32 };
    if (h >= 17) return { color: '#ff8c40', alpha: 0.08 };
    if (h < 8) return { color: '#ffc080', alpha: 0.06 };
    return null;
  }
  function drawWindow(x, y, sky) {
    rect('#2a2133', x - 1, y - 1, 24, 10);
    rect('#efe8dc', x, y, 22, 8);
    rect(sky.top, x + 1, y + 1, 20, 3);

    if (sky.night) { rect('#ffffff', x + 4, y + 2, 1, 1); rect('#ffffff', x + 15, y + 3, 1, 1); rect('#fff6c0', x + 17, y + 1, 2, 2); }
    else { rect('#ffffff', x + 3, y + 2, 4, 1); rect('rgba(255,255,255,0.5)', x + 14, y + 5, 5, 1); }
    rect('#efe8dc', x + 10, y, 2, 8);
    rect('#d9d0c0', x - 1, y + 8, 24, 2);
  }
  function drawClock(cx, cy) {
    g.fillStyle = '#2a2133'; g.beginPath(); g.arc(cx, cy, 4.6, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fbfbf6'; g.beginPath(); g.arc(cx, cy, 3.8, 0, Math.PI * 2); g.fill();
    const d = new Date();
    const m = (d.getMinutes() / 60) * Math.PI * 2, h = ((d.getHours() % 12) / 12) * Math.PI * 2 + m / 12;
    g.strokeStyle = '#2a2133'; g.lineCap = 'round';
    g.lineWidth = 0.9; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(h) * 2.2, cy - Math.cos(h) * 2.2); g.stroke();
    g.lineWidth = 0.6; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(m) * 3.2, cy - Math.cos(m) * 3.2); g.stroke();
  }

  // ───────── 캐릭터 ─────────
  function drawChar(ch, t) {
    const x = Math.round(ch.x), y = Math.round(ch.y);
    const d = ch.data, w = walking(ch), sit = seated(ch);
    const busy = !w && sit && (d.activity === 'write' || d.activity === 'run') && d.status === 'working';
    const frame = Math.floor(t / (busy ? 130 : 170)) % 2;
    const dir = sit ? 'd' : ch.dir;
    const pose = busy ? (frame ? 'typeA' : 'typeB') : 'stand';
    const legs = w ? (frame ? 'walk1' : 'walk2') : 'stand';
    const blink = !w && Math.floor((t + ch.look.seed * 997) / 2600) % 14 === 0;
    const bob = (!w && d.activity === 'read' && Math.floor(t / 600) % 2) ? 1 : 0;
    if (!sit) { rect('rgba(0,0,0,0.2)', x - 4, y - 1, 9, 2); rect('rgba(0,0,0,0.12)', x - 5, y, 11, 1); }
    ctx.drawImage(spriteFor(ch, dir, pose, legs, blink), x - 6, y - 20 + bob + (w && frame ? -1 : 0));
  }

  // 밤에는 실내를 조금 어둡게 하고 모니터 불빛을 비춥니다
  function drawLighting(t) {
    const amb = ambientNow();
    if (!amb) return;
    ctx.save();
    ctx.globalAlpha = amb.alpha;
    ctx.fillStyle = amb.color;
    ctx.fillRect(0, -TOPPAD, layout.W, layout.H + TOPPAD);
    if (amb.alpha > 0.15) {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'lighter';
      for (const z of layout.zones) {
        z.desks.forEach((d, k) => {
          const occ = z.slots[k] ? chars.get(z.slots[k]) : null;
          if (!deskIsOn(occ)) return;
          const gx = d.x - 8, gy = d.y - 4;
          const grad = ctx.createRadialGradient(gx, gy, 1, gx, gy, 20);
          grad.addColorStop(0, 'rgba(120, 160, 255, 0.28)');
          grad.addColorStop(1, 'rgba(120, 160, 255, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(gx - 20, gy - 20, 40, 40);
        });
      }
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ───────── 말풍선 ─────────

  const CHATTER = {
    think: ['음… 어떻게 하는 게 좋을까', '잠깐, 순서 좀 정리하고', '흠, 이 방법이 낫겠다', '생각 중… 🤔'],

    write: ['타닥타닥…', '여기만 고치면 되겠다', '깔끔하게 정리해볼게요', '예외 처리도 넣고…'],
    run: ['제발 한 번에 통과해라…', '돌려봅니다!', '로그 보는 중', '빌드 기다리는 중 ⏳'],
    search: ['이거 어디서 쓰더라', '찾아보는 중 🔍', '여기 있었네'],
    web: ['문서 좀 찾아볼게요', '공식 문서 확인 중', '검색 중…'],
    plan: ['할 일부터 정리하고', '체크리스트 업데이트'],
    tool: ['도구 좀 써볼게요'],
    delegate: ['잘 하고 있겠지?', '진행 상황 지켜보는 중', '기다리는 중…'],
    idle: ['커피 한 잔 ☕', '기지개 쭉~', '잠깐 숨 돌리는 중'],
    waiting: ['다음 지시 기다리는 중', '언제든 불러주세요', '오늘 할 일 끝?'],
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const targetOf = (detail) => { const i = String(detail).indexOf(' · '); return i >= 0 ? detail.slice(i + 3) : detail; };
  let lastChatterAt = 0;

  // 서버 데이터가 바뀌면 말풍선 상태를 갱신 (applySnapshot 에서 호출)
  function updateSpeech(ch) {
    const now = performance.now();
    const d = ch.data;
    if (d.say && d.say.ts !== ch.lastSayTs) {
      ch.lastSayTs = d.say.ts;
      const dur = d.say.kind === 'narration' ? 6500 : 4000;
      const delay = Math.max(0, d.say.ts - Date.now());
      if (Date.now() - d.say.ts < dur) {
        ch.sayBubble = { text: d.say.text, kind: d.say.kind, start: now + delay, until: now + delay + dur };
        ch.nextChatter = now + delay + dur + rnd(8000, 16000);
      }
    }
    if (d.detail !== ch.lastDetail) {
      const first = ch.lastDetail === undefined;
      ch.lastDetail = d.detail;
      if (!first && d.status === 'working' && !['think', 'idle'].includes(d.activity)) {
        ch.actionBubble = { text: `${ICON[d.activity] || '🔧'} ${targetOf(d.detail)}`, start: now, until: now + 3200 };
        ch.nextChatter = now + rnd(8000, 16000);
      }
    }
  }

  let mailFlash = null; // { sessionId, until }
  function activeBubble(ch, now) {
    const d = ch.data;
    const live = (b) => b && now >= b.start && now < b.until;
    if (d.status === 'alert') return { text: '결재 부탁드려요!', style: 'alert' };
    if (live(ch.sayBubble)) return { text: ch.sayBubble.text, style: ch.sayBubble.kind === 'narration' ? 'narration' : 'event', until: ch.sayBubble.until };
    if (walking(ch)) return null;
    if (d.role === 'lead' && mailFlash && mailFlash.sessionId === d.sessionId && now < mailFlash.until) return { emoji: '📨' };
    if (live(ch.actionBubble)) return { text: ch.actionBubble.text, style: 'action', until: ch.actionBubble.until };
    if (live(ch.chatter)) return { text: ch.chatter.text, style: 'chatter', until: ch.chatter.until };
    if (d.status !== 'done' && seated(ch)) {
      if (!ch.nextChatter) ch.nextChatter = now + rnd(5000, 15000);
      else if (now > ch.nextChatter) {
        if (now - lastChatterAt < 2500) ch.nextChatter = now + rnd(2000, 5000); // 여러 명이 동시에 떠들지 않게
        else {
          const key = d.status === 'working' ? d.activity : d.status;
          const pool = CHATTER[key];
          if (pool) { ch.chatter = { text: pickOne(pool), start: now, until: now + 3000 }; lastChatterAt = now; }
          ch.nextChatter = now + rnd(14000, 28000);
        }
      }
    }
    if (d.status === 'done') return { emoji: '✅' };
    if (d.status === 'waiting') return { emoji: d.detail === '보고 완료' ? '✅' : '💬' };
    if (d.status === 'idle') return { emoji: '☕' };
    return { emoji: ICON[d.activity] || '💭' };
  }

  const BUBBLE_STYLE = {
    narration: { bg: '#ffffff', fg: '#1f2430', border: '#3a3346' },
    event: { bg: '#fff3c4', fg: '#3d2f00', border: '#c99a1a' },
    action: { bg: '#e6f0ff', fg: '#1d3a66', border: '#7fa6dc' },
    chatter: { bg: '#f3f1ee', fg: '#5b5566', border: '#b9b2c2' },
    alert: { bg: '#d4433b', fg: '#ffffff', border: '#d4433b' },
  };

  function wrapText(text, maxW) { // 글자 단위 줄바꿈, 최대 2줄
    const lines = [];
    let line = '', overflow = false;
    for (const chr of text) {
      if (line && ctx.measureText(line + chr).width > maxW) {
        lines.push(line.trimEnd());
        if (lines.length === 2) { overflow = true; break; }
        line = chr === ' ' ? '' : chr;
      } else line += chr;
    }
    if (!overflow && line) lines.push(line);
    if (overflow) {
      let l = lines[1];
      while (l && ctx.measureText(l + '…').width > maxW) l = l.slice(0, -1);
      lines[1] = l + '…';
    }
    return lines;
  }

  function drawTextBubble(x, baseY, b, now) {
    const st = BUBBLE_STYLE[b.style] || BUBBLE_STYLE.narration;
    ctx.save();
    if (b.until) ctx.globalAlpha = Math.max(0, Math.min(1, (b.until - now) / 300));
    ctx.font = `${b.style === 'alert' ? 700 : 500} 6px ${CANVAS_FONT}`;
    const lines = wrapText(b.text, 72);
    const w = Math.ceil(Math.max(...lines.map((l) => ctx.measureText(l).width))) + 8;
    const h = lines.length * 7.5 + 4;
    let bx = Math.round(x - w / 2);
    bx = Math.max(2, Math.min(layout.W - w - 2, bx));
    const by = Math.max(-TOPPAD + 2, Math.round(baseY - h));
    ctx.fillStyle = st.bg;
    roundRect(bx, by, w, h, 3); ctx.fill();
    ctx.strokeStyle = st.border; ctx.lineWidth = 0.8; ctx.stroke();
    const tx = Math.max(bx + 4, Math.min(bx + w - 4, x));
    ctx.beginPath(); ctx.moveTo(tx - 2.5, by + h - 0.4); ctx.lineTo(tx, by + h + 3); ctx.lineTo(tx + 2.5, by + h - 0.4); ctx.closePath();
    ctx.fillStyle = st.bg; ctx.fill();
    ctx.fillStyle = st.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    lines.forEach((l, i) => ctx.fillText(l, bx + 4, by + 5.6 + i * 7.5));
    ctx.restore();
  }

  function drawNameAndIcon(ch, b, t) {
    const x = Math.round(ch.x), y = Math.round(ch.y);
    const top = y - 22;
    const name = ch.data.name.length > 14 ? ch.data.name.slice(0, 13) + '…' : ch.data.name;
    ctx.font = `600 6px ${CANVAS_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(name).width;
    ctx.fillStyle = cardId === ch.id ? 'rgba(74, 134, 217, 0.95)' : 'rgba(31, 27, 42, 0.78)';
    roundRect(x - tw / 2 - 3, top - 7, tw + 6, 8, 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(name, x, top - 2.8);
    if (!b || !b.emoji) return;
    const by = top - 19;
    ctx.font = `8px ${EMOJI_FONT}`;
    const bw = Math.max(13, ctx.measureText(b.emoji).width + 6);
    ctx.fillStyle = '#ffffff';
    roundRect(x - bw / 2, by, bw, 11, 3); ctx.fill();
    ctx.strokeStyle = '#3a3346'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 2, by + 11); ctx.lineTo(x, by + 13.5); ctx.lineTo(x + 2, by + 11); ctx.closePath();
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.fillText(b.emoji, x, by + 6);
  }

  function drawSpeech(ch, b, t) {
    if (!b || !b.text) return;
    if (b.style === 'alert' && Math.floor(t / 450) % 2) return; // 결재 요청은 깜빡임
    const x = Math.round(ch.x), y = Math.round(ch.y);
    // 가운데 자리 사람은 말풍선을 한 칸 위로 띄워 양옆과 덜 겹치게
    const lift = ch.seat && ch.seat.k % 3 === 1 && !walking(ch) ? 21 : 0;
    drawTextBubble(x, y - 31 - lift, b, t);
  }

  function draw(t) {
    ctx.clearRect(0, 0, layout.W, layout.H + TOPPAD);
    ctx.save();
    ctx.translate(0, TOPPAD);
    g = ctx;
    drawBackground();
    const items = [];
    for (const z of layout.zones) {
      z.desks.forEach((d, k) => {
        const occ = z.slots[k] ? chars.get(z.slots[k]) : null;
        items.push({ y: d.y - 0.2, draw: () => drawChair(d, z, occ) });
        items.push({ y: d.y, draw: () => drawDesk(d, z, occ, t, k) });
      });
    }
    for (const ch of chars.values()) {
      items.push({ y: seated(ch) ? ch.seat.desk.y - 0.1 : ch.y, draw: () => drawChar(ch, t) });
    }
    items.sort((p, q) => p.y - q.y).forEach((i) => i.draw());
    drawLighting(t);
    const bubbles = new Map();
    for (const ch of chars.values()) bubbles.set(ch, activeBubble(ch, t));
    for (const ch of chars.values()) drawNameAndIcon(ch, bubbles.get(ch), t);
    // 글 말풍선은 맨 위에, 아래쪽 사람부터 그려서 위쪽 사람 말풍선이 가려지지 않게
    [...chars.values()].sort((p, q) => q.y - p.y).forEach((ch) => drawSpeech(ch, bubbles.get(ch), t));
    ctx.restore();
  }

  // ───────── 크기 맞추기 ─────────
  function resize() {
    if (!layout) return;
    const dpr = window.devicePixelRatio || 1;
    const avail = Math.max(320, officeEl.clientWidth - 46);
    const fit = (avail * dpr) / layout.W;
    const devScale = fit >= 2 ? Math.min(Math.floor(fit), 5 * dpr) : fit; // 2배 이상이면 정수 배율로 선명하게
    const scale = devScale / dpr;
    canvas.style.width = `${Math.round(layout.W * scale)}px`;
    canvas.style.height = `${Math.round((layout.H + TOPPAD) * scale)}px`;
    canvas.width = Math.round(layout.W * devScale);
    canvas.height = Math.round((layout.H + TOPPAD) * devScale);
    ctx.setTransform(devScale, 0, 0, devScale, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const empty = document.getElementById('empty');
    empty.style.width = canvas.style.width;
    empty.style.height = canvas.style.height;
  }
  new ResizeObserver(resize).observe(officeEl);

  // ───────── 오른쪽 패널 ─────────
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const timeOf = (ts) => new Date(ts).toTimeString().slice(0, 8);

  function statusLabel(a) {
    if (a.status === 'waiting' && a.detail === '보고 완료') return '보고 완료';
    if (a.status === 'done' && a.role === 'member') return '업무 완료';
    return STATUS[a.status] || a.status;
  }


  // ───────── 사용량 ─────────
  function fmtTok(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }
  const tokTotal = (t) => t ? t.input + t.output + t.cacheWrite + t.cacheRead : 0;
  const level = (p) => (p >= 80 ? 'alert' : p >= 50 ? 'warn' : '');
  function untilText(ms) {
    if (!ms) return '';
    const diff = ms - Date.now();
    if (diff <= 0) return '곧 초기화';
    const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
    if (h >= 24) {
      const d = new Date(ms);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getMonth() + 1}월 ${d.getDate()}일(${days[d.getDay()]}) ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 초기화`;
    }
    return h ? `${h}시간 ${m}분 후 초기화` : `${m}분 후 초기화`;
  }
  function limitHtml(label, w) {
    if (!w) return '';
    const p = Math.max(0, Math.min(100, w.pct));
    return `<div class="limit">
      <div class="limit-head"><span>${label}</span><b>${Math.round(p)}%</b></div>
      <div class="bar" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100" aria-label="${label}"><i class="${level(p)}" style="width:${p}%"></i></div>
      <small>${untilText(w.resetsAt)}</small></div>`;
  }

  function renderUsage() {
    const u = snap.usage;
    const body = document.getElementById('usage-body');
    if (!u) { body.innerHTML = ''; return; }
    const rl = u.rateLimits;
    let html = '';
    if (rl && (rl.fiveHour || rl.sevenDay)) {
      html += limitHtml('현재 세션 (5시간)', rl.fiveHour) + limitHtml('이번 주', rl.sevenDay);
      const age = Date.now() - rl.updatedAt;
      if (age > 10 * 60000) html += `<p class="usage-hint">${Math.round(age / 60000)}분 전 기준 · Claude Code를 쓰면 갱신돼요</p>`;
    } else {
      html += '<p class="usage-hint">한도 사용률은 터미널에서 Claude Code를 쓰면 표시돼요 (Pro·Max 요금제).</p>';
    }
    const t = u.today;
    html += `<div class="tok-today"><span>오늘 사용한 토큰</span><b>${fmtTok(tokTotal(t))}</b>
      <small>입력 ${fmtTok(t.input)}, 출력 ${fmtTok(t.output)}, 캐시 쓰기 ${fmtTok(t.cacheWrite)}, 캐시 읽기 ${fmtTok(t.cacheRead)}</small></div>`;
    for (const x of u.sessions) {
      const ctx = x.ctxPct != null ? Math.round(x.ctxPct) : null;
      html += `<div class="sess-row">
        <span class="name">${esc(x.project)}</span>
        <span class="tok">${fmtTok(tokTotal(x.tokens))}</span>
        <span class="sub">
          ${x.model ? `<span>${esc(x.model)}</span>` : ''}
          ${ctx != null ? `<span class="ctx">컨텍스트 <span class="bar"><i class="${level(ctx)}" style="width:${ctx}%"></i></span>${ctx}%</span>` : ''}
          ${x.costUsd != null ? `<span title="API 요금으로 환산한 금액">$${x.costUsd.toFixed(2)}</span>` : ''}
        </span></div>`;
    }
    body.innerHTML = html;

    document.getElementById('s-tokens').textContent = fmtTok(tokTotal(t));
    const box = document.getElementById('s-limit-box');
    if (rl && rl.fiveHour) {
      box.hidden = false;
      document.getElementById('s-limit').textContent = `${Math.round(rl.fiveHour.pct)}%`;
      box.classList.toggle('alert', rl.fiveHour.pct >= 80);
    } else box.hidden = true;
  }
  setInterval(renderUsage, 30000); // 초기화까지 남은 시간 갱신

  let lastLogId = -1;
  function renderPanels() {
    const a = snap.agents;
    document.getElementById('s-sessions').textContent = snap.sessions.length;
    document.getElementById('s-working').textContent = a.filter((x) => x.status === 'working').length;
    const alerts = a.filter((x) => x.status === 'alert').length;
    document.getElementById('s-alert').textContent = alerts;
    document.getElementById('s-alert-box').classList.toggle('alert', alerts > 0);
    document.title = alerts ? `(결재 ${alerts}) Agent Office` : 'Agent Office';
    document.getElementById('empty').classList.toggle('show', a.length === 0);
    renderUsage();

    const html = zoneNames(snap.config).map((name) => {
      const people = a.filter((x) => x.dept === name);
      const rows = people.length
        ? people.map((p) => `
          <div class="person">
            <span class="who">${esc(p.name)}${p.role === 'member' && p.project ? ` <small style="color:var(--muted);font-weight:400">${esc(p.project)}</small>` : ''}</span>
            <span class="chip ${esc(p.status)}">${esc(statusLabel(p))}</span>
            ${p.task ? `<span class="what task">${p.role === 'lead' ? '지시' : '업무'}: ${esc(p.task)}</span>` : ''}
            <span class="what">${esc(p.detail)}</span>
          </div>`).join('')
        : '<div class="vacant">자리 비어 있음</div>';
      return `<div class="dept">
        <div class="dept-head"><span class="swatch" style="background:${deptColor(name)}"></span>${esc(name)}<small>${people.length}명</small></div>
        ${rows}</div>`;
    }).join('');
    document.getElementById('roster-body').innerHTML = html;

    const newest = snap.log.length ? snap.log[snap.log.length - 1].id : -1;
    if (newest !== lastLogId) {
      lastLogId = newest;
      document.getElementById('log').innerHTML = snap.log.slice().reverse().map((l) =>
        `<li><time>${timeOf(l.ts)}</time><span><b>${esc(l.who)}</b> ${esc(l.text)}</span></li>`).join('')
        || '<li><time></time><span style="color:var(--muted)">기록이 없습니다.</span></li>';
    }
  }

  // ───────── 마우스 오버 ─────────
  let hovered = null;
  canvas.addEventListener('mousemove', (e) => {
    if (!layout) return;
    const r = canvas.getBoundingClientRect();
    const mx = ((e.clientX - r.left) / r.width) * layout.W;
    const my = ((e.clientY - r.top) / r.height) * (layout.H + TOPPAD) - TOPPAD;
    let best = null, bd = 11;
    for (const ch of chars.values()) {
      const dd = Math.hypot(ch.x - mx, ch.y - 10 - my);
      if (dd < bd) { bd = dd; best = ch; }
    }
    hovered = best;
    canvas.style.cursor = best ? 'pointer' : 'default';
    if (!best || cardId === best.id) { tipEl.style.display = 'none'; return; }
    const d = best.data;
    tipEl.innerHTML = `<strong>${esc(d.name)}</strong>
      <span>${esc(d.dept)}${d.project && d.role === 'member' ? ` · ${esc(d.project)}` : ''}</span>
      <span>${esc(statusLabel(d))} — ${esc(d.detail)}</span>
      <span>클릭하면 업무 카드</span>`;
    const o = officeEl.getBoundingClientRect();
    tipEl.style.left = `${e.clientX - o.left + officeEl.scrollLeft + 14}px`;
    tipEl.style.top = `${e.clientY - o.top + officeEl.scrollTop + 14}px`;
    tipEl.style.display = 'block';
  });
  canvas.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; hovered = null; });
  canvas.addEventListener('click', () => {
    if (hovered) { tipEl.style.display = 'none'; openCard(hovered); } else closeCard();
  });

  // ───────── 업무 카드 ─────────
  const cardEl = document.getElementById('card');
  let cardId = null;
  function agoText(ts) {
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return `${s}초 전`;
    if (s < 3600) return `${Math.floor(s / 60)}분 전`;
    return `${Math.floor(s / 3600)}시간 전`;
  }
  function elapsedText(ts) {
    if (!ts) return '';
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return `${s}초째`;
    if (s < 3600) return `${Math.floor(s / 60)}분 ${s % 60}초째`;
    return `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분째`;
  }
  function openCard(ch) { cardId = ch.id; renderCard(); }
  function closeCard() { cardId = null; cardEl.hidden = true; }
  function renderCard() {
    if (!cardId) return;
    const ch = chars.get(cardId);
    if (!ch || ch.leaving) { closeCard(); return; }
    const d = ch.data;
    const rep = latestReportOf(ch);
    const color = deptColor(d.dept);
    const recent = (d.recent || []).slice().reverse();
    cardEl.innerHTML = `
      <div class="card-head">
        <span class="avatar sm" style="background:${color}" aria-hidden="true">${esc([...d.name][0] || '?')}</span>
        <div><b>${esc(d.name)}</b><small>${esc(d.dept)}${d.role === 'member' && d.project ? `, ${esc(d.project)}` : ''}</small></div>
        <span class="chip ${esc(d.status)}">${esc(statusLabel(d))}</span>
        <button type="button" class="card-x" aria-label="닫기">×</button>
      </div>
      ${d.task ? `<div class="card-sec"><span class="lbl">${d.role === 'lead' ? '받은 지시' : '맡은 업무'}</span><p>${esc(d.task)}</p></div>` : ''}
      <div class="card-sec"><span class="lbl">지금 하는 일</span><p>${esc(d.detail)}<small>${elapsedText(d.activitySince)}</small></p></div>
      ${d.say && d.say.kind === 'narration' ? `<div class="card-sec"><span class="lbl">최근 한마디 <span>${agoText(d.say.ts)}</span></span><p class="quote">“${esc(d.say.text)}”</p></div>` : ''}
      <div class="card-sec"><span class="lbl">최근 작업 <span>${d.toolCount || 0}건 처리</span></span>
        <ol class="recent">${recent.map((r) => `<li><span>${esc(r.text)}</span><time>${agoText(r.ts)}</time></li>`).join('') || '<li><span>아직 없음</span></li>'}</ol>
      </div>
      ${rep ? `<button type="button" class="card-report" data-report="${esc(rep.id)}">📎 최근 보고서: ${esc(rep.subject)}</button>` : ''}`;
    // 캐릭터 옆에 띄우기
    const cw = canvas.clientWidth, chh = canvas.clientHeight;
    const px = canvas.offsetLeft + (ch.x / layout.W) * cw;
    const py = canvas.offsetTop + ((ch.y + TOPPAD) / (layout.H + TOPPAD)) * chh;
    cardEl.hidden = false;
    const w = cardEl.offsetWidth, h = cardEl.offsetHeight;
    let left = px + 18;
    if (left + w > officeEl.scrollWidth - 8) left = px - w - 18;
    let top = py - h / 2;
    top = Math.max(8, Math.min(top, canvas.offsetTop + chh - h));

    cardEl.style.top = `${top}px`;
  }
  cardEl.addEventListener('click', (e) => {
    if (e.target.closest('.card-x')) { closeCard(); return; }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCard(); });
  setInterval(() => { if (cardId) renderCard(); }, 1000);


  // ───────── 보고서함 ─────────
  let reports = [], reportsVersion = -1, lastSeenReportTs = null;
  let selectedId = null, filter = 'all', query = '';
  const mailItemsEl = document.getElementById('mail-items');
  const mailReadEl = document.getElementById('mail-read');

  function latestReportOf(ch) {
    const d = ch.data;
    return reports.find((r) => r.from === d.name && r.session === d.sessionId)
      || reports.find((r) => r.from === d.name && (!d.project || r.project === d.project));
  }

  function onReportsSummary(sum) {
    if (!sum) return;
    const badge = document.getElementById('badge');
    badge.textContent = sum.unread;
    badge.hidden = !sum.unread;
    if (sum.last && lastSeenReportTs !== null && sum.last.ts > lastSeenReportTs && sum.last.kind === 'member') {
      mailFlash = { sessionId: sum.last.sessionId, until: performance.now() + 4500 };
    }
    if (sum.last) lastSeenReportTs = Math.max(lastSeenReportTs || 0, sum.last.ts);
    else if (lastSeenReportTs === null) lastSeenReportTs = 0;

  }

  async function loadReportList() {
    try {
      const res = await fetch('/api/reports');
      reports = (await res.json()).reports;
    } catch { return; }
    renderMailList();
    if (selectedId && !reports.some((r) => r.id === selectedId)) { selectedId = null; renderReadingEmpty(); }
    else if (isInbox() && selectedId && !mailReadEl.dataset.id) openReport(selectedId);
  }

  function shortTime(ts) {
    const d = new Date(ts), now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    if (d.toDateString() === now.toDateString()) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}월 ${d.getDate()}일`;
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  }
  function fullTime(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function visibleReports() {
    const q = query.trim().toLowerCase();
    return reports.filter((r) => {
      if (filter === 'unread' && r.read) return false;
      if (filter === 'lead' && r.kind !== 'lead') return false;
      if (filter === 'member' && r.kind !== 'member') return false;
      if (!q) return true;
      return [r.from, r.subject, r.preview, r.dept, r.project].some((v) => String(v || '').toLowerCase().includes(q));
    });
  }

  function renderMailList() {
    const list = visibleReports();
    if (!list.length) {
      mailItemsEl.innerHTML = `<li class="mail-none">${reports.length ? '조건에 맞는 보고서가 없습니다.' : '아직 받은 보고서가 없습니다.'}</li>`;

    }
    mailItemsEl.innerHTML = list.map((r) => `
      <li><button type="button" class="mail-item${r.read ? '' : ' unread'}${r.id === selectedId ? ' active' : ''}" data-id="${esc(r.id)}">
        <span class="mi-top">

          <span class="mi-dept" style="color:${deptColor(r.dept)}">${esc(r.dept)}</span>
          ${r.attachments && r.attachments.length ? `<span class="mi-clip" title="첨부 ${r.attachments.length}개">📎 ${r.attachments.length}</span>` : ''}
          <time datetime="${new Date(r.ts).toISOString()}">${shortTime(r.ts)}</time>
        </span>
        <span class="mi-subject">${esc(r.subject)}</span>
        <span class="mi-preview">${esc(r.preview)}</span>
      </button></li>`).join('');
  }

  function renderReadingEmpty() {
    delete mailReadEl.dataset.id;
    mailReadEl.innerHTML = '<div class="mail-empty">보고서를 고르면 여기에 열립니다.<br>서브에이전트가 업무를 마치거나 팀장이 긴 답변을 끝내면 도착해요.</div>';
  }

  async function openReport(id) {
    selectedId = id;
    renderMailList();
    let r;
    try {
      const res = await fetch(`/api/reports/${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error();
      r = await res.json();
    } catch {
      mailReadEl.innerHTML = '<div class="mail-empty">보고서를 열지 못했습니다. 파일이 지워졌는지 확인하세요.</div>';
      return;
    }
    mailReadEl.dataset.id = id;
    const color = deptColor(r.dept);
    mailReadEl.innerHTML = `
      <h2 class="mail-subject">${esc(r.subject)}</h2>
      <div class="mail-meta">
        <span class="avatar" style="background:${color}" aria-hidden="true">${esc([...r.from][0] || '?')}</span>
        <div class="who"><b>${esc(r.from)}</b> <span style="color:${color}">${esc(r.dept)}</span>
          <small>${r.project ? `${esc(r.project)}, ` : ''}${fullTime(r.ts)}</small></div>
        <div class="mail-actions">
          <button type="button" id="btn-unread">안 읽음으로</button>
          <button type="button" class="danger" id="btn-delete">삭제</button>
        </div>
      </div>
      ${attachmentsHtml(r)}
      <div class="md">${renderMarkdown(r.body, r)}</div>`;
    mailReadEl.scrollTop = 0;
    document.getElementById('btn-unread').onclick = () => markRead(id, false);
    document.getElementById('btn-delete').onclick = () => deleteReport(id);
    if (!r.read) markRead(id, true);
  }

  async function markRead(id, read) {
    const item = reports.find((x) => x.id === id);
    if (item) item.read = read;
    renderMailList();
    await fetch(`/api/reports/${encodeURIComponent(id)}/read`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ read }),
    }).catch(() => {});
  }

  async function deleteReport(id) {
    if (!confirm('이 보고서를 삭제할까요? reports 폴더의 파일도 함께 지워집니다.')) return;
    const list = visibleReports();
    const idx = list.findIndex((x) => x.id === id);
    const next = list[idx + 1] || list[idx - 1];
    await fetch(`/api/reports/${encodeURIComponent(id)}`, { method: 'DELETE' }).catch(() => {});
    reports = reports.filter((x) => x.id !== id);
    if (next) openReport(next.id); else { selectedId = null; renderMailList(); renderReadingEmpty(); }
  }


  function attachmentsHtml(r) {
    const list = r.attachments || [];
    if (!list.length) return '';
    return `<div class="attach"><span>첨부 ${list.length}개</span>${list.map((a) => {
      const i = a.lastIndexOf('/');
      const name = a.slice(i + 1), dir = i > 0 ? a.slice(0, i) : '';
      return `<button type="button" class="file" data-file="${esc(a)}" title="${esc(a)} 다운로드"><b>${esc(name)}</b>${dir ? `<small>${esc(dir)}</small>` : ''}</button>`;
    }).join('')}</div>`;
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  // 다운로드는 누르는 순간 서버가 디스크에서 파일을 읽어 내려줍니다 (보고서에는 파일 내용이 저장되지 않음)
  async function downloadAttachment(rel, el) {
    const id = mailReadEl.dataset.id;
    if (!id) return;
    try {
      const res = await fetch(`/api/reports/${encodeURIComponent(id)}/file?path=${encodeURIComponent(rel)}`);
      if (!res.ok) throw new Error(await res.text() || '다운로드하지 못했습니다.');
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = rel.split('/').pop();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) {
      if (el && el.classList.contains('file')) el.classList.add('missing');
      toast(`${rel.split('/').pop()}: ${e.message}`);
    }
  }
  mailReadEl.addEventListener('click', (e) => {
    const el = e.target.closest('[data-file]');
    if (!el) return;
    e.preventDefault();
    downloadAttachment(el.dataset.file, el);
  });

  mailItemsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.mail-item');
    if (btn) openReport(btn.dataset.id);
  });
  mailItemsEl.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const items = [...mailItemsEl.querySelectorAll('.mail-item')];
    const i = items.indexOf(document.activeElement);
    const next = items[i + (e.key === 'ArrowDown' ? 1 : -1)];
    if (next) { e.preventDefault(); next.focus(); openReport(next.dataset.id); }
  });
  document.getElementById('mail-search').addEventListener('input', (e) => { query = e.target.value; renderMailList(); });
  document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderMailList();
  }));

  // 아주 작은 마크다운 렌더러 (제목, 목록, 표, 인용, 굵게, 인라인 코드). HTML 은 모두 이스케이프합니다.
  let mdCtx = null; // 지금 렌더링 중인 보고서 (첨부 링크 판별용)
  const normPath = (h) => String(h).replace(/&amp;/g, '&').replace(/\\/g, '/').replace(/#L\d+(-L?\d+)?$/i, '')
    .replace(/(:\d+){1,2}$/, '').replace(/^\.\//, '');
  function attachmentFor(href) {
    if (!mdCtx || !mdCtx.attachments) return null;
    const h = normPath(href);
    return mdCtx.attachments.find((a) => a === h || h.endsWith('/' + a) || a.endsWith('/' + h)) || null;
  }
  function inlineMd(t) {
    return esc(t)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
        const file = attachmentFor(href);
        if (file) return `<a href="#" class="file-link" data-file="${file.replace(/"/g, '&quot;')}">${label}</a>`;
        if (/^https?:\/\//i.test(href)) return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        return label;
      })
      .replace(/`([^`]+)`/g, (m, code) => {
        const file = attachmentFor(code);
        return file ? `<a href="#" class="file-link" data-file="${file.replace(/"/g, '&quot;')}"><code>${code}</code></a>` : `<code>${code}</code>`;
      })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
  }
  function renderMarkdown(src, report) {
    mdCtx = report || null;
    const lines = String(src || '').replace(/\r/g, '').split('\n');
    let html = '', para = [], i = 0;
    const flush = () => { if (para.length) { html += `<p>${inlineMd(para.join(' '))}</p>`; para = []; } };
    const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
    const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
    const listRe = /^\s*([-*+]|\d+[.)])\s+/;
    while (i < lines.length) {
      const l = lines[i];
      let m;
      if (/^\s*(`{3,}|~{3,})/.test(l)) {
        flush(); const buf = []; i++;
        while (i < lines.length && !/^\s*(`{3,}|~{3,})/.test(lines[i])) buf.push(lines[i++]);
        i++; html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
      }
      if (!l.trim()) { flush(); i++; continue; }
      if (/^\[코드 생략/.test(l.trim())) { flush(); html += `<div class="omitted">${esc(l.trim().slice(1, -1))}</div>`; i++; continue; }
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); const lv = Math.min(5, m[1].length + 2); html += `<h${lv}>${inlineMd(m[2])}</h${lv}>`; i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); html += '<hr>'; i++; continue; }
      if (isRow(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        flush(); const head = cells(l); i += 2; const rows = [];
        while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
        html += `<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${inlineMd(c)}</th>`).join('')}</tr></thead>` +
          `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        continue;
      }
      if (listRe.test(l)) {
        flush(); const ordered = /^\s*\d/.test(l); const items = [];
        while (i < lines.length && listRe.test(lines[i])) items.push(lines[i++].replace(listRe, ''));
        const tag = ordered ? 'ol' : 'ul';
        html += `<${tag}>${items.map((t) => `<li>${inlineMd(t)}</li>`).join('')}</${tag}>`; continue;
      }
      if (/^>\s?/.test(l)) {
        flush(); const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
        html += `<blockquote>${inlineMd(buf.join(' '))}</blockquote>`; continue;
      }
      para.push(l.trim()); i++;
    }
    flush();
    return html;
  }

  // ───────── 화면 전환 ─────────
  const isInbox = () => location.hash === '#inbox';
  function route() {
    const inbox = isInbox();
    document.getElementById('view-office').hidden = inbox;
    document.getElementById('view-inbox').hidden = !inbox;
    document.getElementById('tab-office').toggleAttribute('aria-current', !inbox);
    document.getElementById('tab-inbox').toggleAttribute('aria-current', inbox);
    if (!inbox) document.getElementById('tab-office').setAttribute('aria-current', 'page');
    else document.getElementById('tab-inbox').setAttribute('aria-current', 'page');
    if (inbox) {
      renderMailList();
      if (selectedId) openReport(selectedId); else renderReadingEmpty();
    } else {
      resize();
    }
  }
  window.addEventListener('hashchange', route);

  // ───────── 연결 ─────────
  const connEl = document.getElementById('conn');
  function connect() {
    const es = new EventSource('/stream');
    es.onopen = () => { connEl.textContent = '연결됨'; connEl.classList.add('on'); };
    es.onmessage = (e) => { try { applySnapshot(JSON.parse(e.data)); } catch (err) { console.error(err); } };
    es.onerror = () => { connEl.textContent = '서버 연결 끊김 · 재시도 중'; connEl.classList.remove('on'); };
  }

  // ───────── 루프 ─────────
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (layout) {
      for (const ch of [...chars.values()]) {
        step(ch, dt);
        if (ch.leaving && !walking(ch)) chars.delete(ch.id);
      }
      draw(now);
    }
    requestAnimationFrame(loop);
  }

  layout = buildLayout(snap.config);
  buildBackground();
  layoutKey = JSON.stringify(zoneNames(snap.config)) + '[]';
  resize();
  renderPanels();
  route();
  connect();
  requestAnimationFrame(loop);
})();
</script>
</body>
